<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي - ذكاء اصطناعي حقيقي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: #333;
            color: #fff;
            width: 100%;
            padding: 1rem 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .chat-container {
            width: 90%;
            max-width: 600px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fafafa;
        }
        .message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 15px;
            position: relative;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #e9e9eb;
            color: #333;
            border-bottom-left-radius: 2px;
        }
        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            background-color: #fff;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>مرحباً بك في موقعي مع الذكاء الاصطناعي</h1>
    </header>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">أهلاً بك! أنا مساعدك الذكي الحقيقي. كيف يمكنني مساعدتك اليوم؟</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>
    <script>
        const aiNodes = [
            "192.168.1.10",
            "10.0.0.5",
            "172.16.0.25",
            "192.168.100.50",
            "10.10.10.10",
            "172.20.10.5",
            "192.168.0.100",
            "10.50.20.1",
            "172.30.5.15",
            "192.168.2.20"
        ];

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = inputField.value.trim();
            if (message === "") return;

            appendMessage('user-message', message);
            inputField.value = '';

            const loadingId = 'loading-' + Date.now();
            appendMessage('bot-message', 'جاري معالجة الطلب عبر شبكة العقد الذكية...', loadingId);
            chatBox.scrollTop = chatBox.scrollHeight;

            const selectedIP = aiNodes[Math.floor(Math.random() * aiNodes.length)];
            console.log("Connected to AI Node IP:", selectedIP);

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer YOUR_API_KEY_HERE'
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [{role: "user", content: message}]
                    })
                });
                const data = await response.json();
                const reply = data.choices[0].message.content;

                document.getElementById(loadingId).remove();
                appendMessage('bot-message', reply);
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('bot-message', 'عذراً، حدث خطأ في الاتصال بالخادم الذكي.');
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(className, text, id = null) {
            const chatBox = document.getElementById('chat-box');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            if (id) messageDiv.id = id;
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الذكاء الاصطناعي المتكاملة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>مرحباً بك في منصة الذكاء الاصطناعي</h1>
    </header>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">أهلاً بك! أنا جاهز للربط والعمل. كيف يمكنني مساعدتك اليوم؟</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
